apiVersion: batch/v1
kind: Job
metadata:
  name: line-preprocess
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 0
  template:
    metadata:
      labels:
        aap.intel.politie/minio-sts-inject: "true"
    spec:
      containers:
        - name: python
          image: harbor.prod.aap.intel.politie/official-images/aap-job-pytorch-gpu:latest
          command:
            - "/bin/bash"
            - "-c"
          args:
            - |
              git clone https://$GIT_USERNAME:$GIT_TOKEN@gitlab.intel.politie/ISC98783/HAP.git &&
              cd HAP &&
              pip install --user -r requirements.txt &&
              conda install -c conda-forge ffmpeg -y &&
              cd line_inference &&

              source minio_sts_auth &&
              mc cp -r aapminio/isc98783/videos/ /tmp/videos/ &&
              mc cp aapminio/isc98783/checkpoints/line/model_assets/isc_ft_v107.pth.tar \
                meta-vsc-descriptor-runtime/submission_src/model_assets/isc_ft_v107.pth.tar &&
              mc cp aapminio/isc98783/checkpoints/line/model_assets/copy_type_pred__convnext_clip.ckpt \
                meta-vsc-descriptor-runtime/submission_src/model_assets/copy_type_pred__convnext_clip.ckpt &&

              python FIVR_exp/precompute_line_desc.py \
                --video-dir /tmp/videos \
                --output /tmp/references.npz &&

              source minio_sts_auth &&
              mc cp /tmp/references.npz aapminio/isc98783/line_desc/references.npz
          env:
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: git-credentials
                  key: GIT_USERNAME
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: git-credentials
                  key: GIT_TOKEN
          resources:
            limits:
              memory: "30Gi"
              cpu: "1"
              nvidia.com/mig-2g.20gb: "1"
            requests:
              memory: "30Gi"
              cpu: "1"
      restartPolicy: Never
